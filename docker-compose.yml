version: '3.8'

services:
  app:
    build: .
    container_name: localexpress_app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    working_dir: /app
    command: php -S 0.0.0.0:8000 -t public
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: localexpress_mysql
    restart: always
    environment:
      MYSQL_DATABASE: shop_db
      MYSQL_ROOT_PASSWORD: secretpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
